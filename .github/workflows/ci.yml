# Workflow 1: Continuous Integration + Continuous Delivery
#
# Dispara em:
#   - pull request para a develop  -> roda só o CI (valida o PR antes do merge)
#   - push na develop (merge do PR) -> roda o CI e, se tudo passar, o Delivery
#
# CI = análise estática (ESLint) + testes de unidade/integração com cobertura
#      + teste de interface (Selenium)
# Delivery = leva o código aprovado da develop para a main automaticamente.
#            O push na main dispara o workflow de deploy (deploy.yml).

name: CI/CD

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

jobs:
  analise-estatica:
    name: Análise de código estático (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  testes-unidade:
    name: Testes de unidade e cobertura (Jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Falha se a cobertura ficar abaixo de 80% (coverageThreshold no jest.config.js)
      - run: npm test
      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-cobertura
          path: coverage/
          retention-days: 7

  teste-interface:
    name: Teste de interface (Selenium)
    runs-on: ubuntu-latest
    # O runner ubuntu-latest já vem com Google Chrome instalado.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:e2e

  delivery:
    name: Continuous Delivery (develop -> main)
    runs-on: ubuntu-latest
    needs: [analise-estatica, testes-unidade, teste-interface]
    # Só entrega quando o código já está na develop (não em PR aberto).
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Token pessoal: push feito com o GITHUB_TOKEN padrão NÃO dispara
          # outros workflows, então o deploy não rodaria.
          token: ${{ secrets.ACCESS_TOKEN }}

      - name: Merge da develop na main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main
          git merge --no-ff origin/develop -m "Delivery: merge da develop na main (${GITHUB_SHA::7})"
          git push origin main
