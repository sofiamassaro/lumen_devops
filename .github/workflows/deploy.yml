# Workflow 2: Continuous Deployment na EC2
#
# Dispara a cada push na main (feito automaticamente pelo job de Delivery).
#   1. Gera a imagem Docker e envia ao Docker Hub (tags: SHA do commit e latest)
#   2. Copia o docker-compose.yaml para a EC2
#   3. Entra na EC2 por SSH, baixa a imagem nova e reinicia o container

name: Deploy EC2

on:
  push:
    branches: [main]
  workflow_dispatch: # permite rodar manualmente pela aba Actions

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/projeto-devops
  APP_DIR: /opt/lumen

jobs:
  build-push:
    name: Build e push da imagem Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

  deploy:
    name: Deploy na EC2
    runs-on: ubuntu-latest
    needs: build-push
    steps:
      - uses: actions/checkout@v4

      - name: Copiar docker-compose.yaml para a EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: docker-compose.yaml
          target: ${{ env.APP_DIR }}

      - name: Atualizar o container
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ${{ env.APP_DIR }}
            export IMAGE=${{ env.IMAGE_NAME }}:${{ github.sha }}
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
            sleep 5
            curl -fsS http://localhost:3000/health
